name: Release

# Push a tag like v0.5.0 and this builds the installers and attaches them to a
# draft GitHub release. Check the draft, then publish it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # One .dmg that runs natively on both Intel and Apple silicon Macs.
          - os: macos-latest
            target: universal-apple-darwin
            args: --target universal-apple-darwin
          - os: windows-latest
            target: ""
            args: ""
          # 22.04 keeps the AppImage and .deb working on older distros too.
          - os: ubuntu-22.04
            target: ""
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Signing is optional. Without these secrets the Mac build is signed
      # ad hoc and shows an "unknown developer" warning on first open. Only
      # values that exist are exported: an empty APPLE_CERTIFICATE would make
      # the bundler try to import a certificate that isn't there.
      - name: Apple signing, when configured
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              { echo "$v<<__GATE_EOF__"; echo "${!v}"; echo "__GATE_EOF__"; } >> "$GITHUB_ENV"
            fi
          done

      # Without an Apple certificate, the Mac build is signed with the project's
      # own self-signed certificate instead of ad hoc. Its identity stays the
      # same from release to release, so macOS keeps the permissions people
      # gave (camera, automation) after a one-click update.
      - name: Self-signed Mac signing, when configured
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          P12: ${{ secrets.MAC_SELF_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_SELF_SIGN_PASSWORD }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] || [ -z "$P12" ]; then exit 0; fi
          KC="$RUNNER_TEMP/gentra-sign.keychain-db"
          KC_PASS=$(openssl rand -hex 16)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/sign.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/sign.p12"
          # The certificate's SHA-1 names it exactly; it isn't Apple-trusted, so it has no team name to look up.
          ID=$(security find-identity -p codesigning "$KC" | awk '/\)/ {print $2; exit}')
          echo "Signing with $ID"
          echo "APPLE_SIGNING_IDENTITY=$ID" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files; the app checks them against the public key in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Gentra Island ${{ github.ref_name }}
          releaseBody: |
            See CHANGELOG.md for what's new and INSTALL.md for step-by-step installation on macOS, Windows, and Linux.
            Check your download against SHA256SUMS.txt below.
          releaseDraft: true
          # Update files and latest.json only in releases, so local builds need no key.
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json

  # One checksum file for every installer, so people can verify their download.
  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Add SHA-256 checksums to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$REPO" --pattern '*'
          rm -f SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$REPO" --clobber

      # One-click updates read latest.json; every platform must be in it.
      - name: Check latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release download "$TAG" --repo "$REPO" --pattern latest.json --output - > latest.json
          jq '.version, (.platforms | keys)' latest.json
          for p in darwin-aarch64 darwin-x86_64 windows-x86_64 linux-x86_64; do
            jq -e --arg p "$p" '.platforms[$p].signature | length > 0' latest.json > /dev/null || { echo "latest.json is missing $p"; exit 1; }
          done
