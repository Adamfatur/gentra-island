[package]
name = "gentra-island"
version = "0.6.0"
description = "A Dynamic Island for macOS, Windows, and Linux"
authors = ["Adam Faturahman"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "gentra_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-drag = "2.1.1"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSGeometry", "NSFileManager", "NSURL", "NSError"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSPanel", "NSResponder", "NSScreen", "NSPasteboard", "NSWorkspace", "NSRunningApplication", "NSGraphics", "NSSharingService"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
trash = "5.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_DataExchange"] }
winreg = "0.56"
windows = { version = "0.62", features = ["Media_Control", "Foundation", "Storage_Streams"] }
windows-future = "0.3"

# Optimise dependencies even in debug builds; sysinfo and image are slow unoptimised.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true
